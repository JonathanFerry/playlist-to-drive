name: tests

# Runs on every push and pull request. The tests touch only pure-Python
# modules — no Google credentials are needed, and none are available to
# this workflow.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the floor: the config loader uses tomllib.
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyflakes

      - name: Lint
        run: pyflakes *.py pipeline/*.py tools/*.py tests/*.py

      - name: Import every module
        # Catches the failure class that hurt most here: a local module
        # shadowing a standard library name breaks on import, not on use,
        # so it passes a lint check and then kills every spawned job.
        run: |
          python -c "
          import importlib, pathlib, sys
          sys.path.insert(0, '.')
          for p in sorted(pathlib.Path('pipeline').glob('*.py')):
              if p.stem != '__init__':
                  importlib.import_module(f'pipeline.{p.stem}')
          print('all pipeline modules import')
          "

      - name: Tests
        run: python tests/test_pipeline.py
